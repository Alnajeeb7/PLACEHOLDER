<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404: This page could not be found</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #000;
            --foreground: #ededed;
            --muted: #888;
            --border: #333;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;

            background: var(--background);
            color: var(--foreground);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* Main */

        main {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 24px;
        }

        .content {
            width: 100%;
            max-width: 640px;

            text-align: center;
        }

        /* 404 */

        .error {
            font-size: clamp(120px, 22vw, 220px);

            line-height: 0.85;

            font-weight: 700;

            letter-spacing: -0.09em;

            color: #fff;

            user-select: none;
        }

        /* Divider */

        .divider {
            width: 100%;
            height: 1px;

            margin: 42px 0 32px;

            background: var(--border);
        }

        /* Heading */

        h1 {
            font-size: clamp(24px, 4vw, 32px);

            line-height: 1.2;

            font-weight: 600;

            letter-spacing: -0.04em;

            color: #fff;
        }

        /* Description */

        p {
            max-width: 470px;

            margin: 14px auto 0;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;
        }

        /* Mobile */

        @media (max-width: 600px) {

            main {
                padding:
                    40px 20px;
            }

            .error {
                font-size: 120px;
            }

            .divider {
                margin-top: 34px;
                margin-bottom: 26px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main>

        <section class="content">

            <div class="error">
                404
            </div>

            <div class="divider"></div>

            <h1>
                This page could not be found.
            </h1>

            <p>
                The page you are looking for doesn't exist or may have
                been moved to another location.
            </p>

        </section>

    </main>

</body>
</html>
