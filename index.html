<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404: NOT_FOUND</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111111;
            color: #ededed;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }

        .error-box {
            width: calc(100% - 72px);
            max-width: 640px;

            padding: 39px 35px 37px;

            border: 1px solid #333333;
            border-radius: 6px;

            background: #111111;
        }

        .title {
            margin: 0;

            font-size: 26px;
            line-height: 1.25;

            font-weight: 400;
            letter-spacing: -0.02em;
        }

        .title strong {
            font-weight: 700;
        }

        .line {
            margin: 32px 0 0;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                "Courier New",
                monospace;

            font-size: 17px;
            line-height: 1.5;

            color: #ededed;
        }

        .id {
            margin-top: 32px;
        }

        @media (max-width: 600px) {
            .error-box {
                width: calc(100% - 48px);
                padding: 36px 34px;
            }

            .title {
                font-size: 25px;
            }

            .line {
                font-size: 16px;
                word-break: break-word;
            }
        }

        @media (max-width: 420px) {
            .error-box {
                width: calc(100% - 36px);
                padding: 34px 28px;
            }

            .title {
                font-size: 23px;
            }

            .line {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="error-box">

        <p class="title">
            <strong>404</strong>: NOT_FOUND
        </p>

        <p class="line">
            Code: `DEPLOYMENT_NOT_FOUND`
        </p>

        <p class="line id">
            ID: `bom1::npf7n-1789103781646-84504f44d1c7`
        </p>

    </main>

</body>
</html>
