<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404: This page could not be found</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #000000;
            --foreground: #ededed;
            --muted: #888888;
            --border: #333333;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: var(--background);
            color: var(--foreground);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* Vercel Header */

        header {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 72px;

            display: flex;
            align-items: center;

            padding: 0 32px;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            letter-spacing: -0.02em;
        }

        /* Vercel Triangle */

        .logo {
            position: relative;

            width: 22px;
            height: 20px;

            display: block;
        }

        .logo::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 0;

            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-bottom: 19px solid #ffffff;
        }

        /* Main */

        main {
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 100px 24px;
        }

        .content {
            width: 100%;

            max-width: 640px;

            text-align: center;
        }

        /* 404 */

        .error {
            font-size: clamp(120px, 22vw, 220px);

            line-height: 0.85;

            font-weight: 700;

            letter-spacing: -0.09em;

            color: #ffffff;

            user-select: none;
        }

        /* Divider */

        .divider {
            width: 100%;

            height: 1px;

            margin: 42px 0 32px;

            background: var(--border);
        }

        /* Heading */

        h1 {
            color: #ffffff;

            font-size: clamp(24px, 4vw, 32px);

            line-height: 1.2;

            font-weight: 600;

            letter-spacing: -0.04em;
        }

        /* Description */

        p {
            max-width: 470px;

            margin: 14px auto 0;

            color: var(--muted);

            font-size: 15px;

            line-height: 1.6;
        }

        /* Mobile */

        @media (max-width: 600px) {

            header {
                height: 64px;

                padding: 0 20px;
            }

            main {
                padding:
                    80px 20px
                    60px;
            }

            .error {
                font-size: 120px;
            }

            .divider {
                margin-top: 34px;

                margin-bottom: 26px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }
        }

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {

            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Vercel Header -->

    <header>

        <a
            href="/"
            class="brand"
            aria-label="Vercel"
        >

            <span class="logo"></span>

            <span>Vercel</span>

        </a>

    </header>


    <!-- 404 Content -->

    <main>

        <section class="content">

            <div class="error">
                404
            </div>

            <div class="divider"></div>

            <h1>
                This page could not be found.
            </h1>

            <p>
                The page you are looking for doesn't exist or may have
                been moved to another location.
            </p>

        </section>

    </main>

</body>
</html>
